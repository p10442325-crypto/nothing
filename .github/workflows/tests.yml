name: Python tests

on:
  push:
    branches:
      - main
      - feature/creator-first-search
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GameModFinder_0.1.4/GameModFinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run test suite
        run: python -m pytest tests -q
